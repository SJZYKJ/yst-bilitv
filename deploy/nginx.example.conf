map $host $bili_relay_backend {
    hostnames;
    default                         127.0.0.1:8601;
    api.example.com                 127.0.0.1:8601;
    app.example.com                 127.0.0.1:8602;
    passport.example.com            127.0.0.1:8603;
    account.example.com             127.0.0.1:8604;
    bangumi.example.com             127.0.0.1:8605;
    member.example.com              127.0.0.1:8606;
    panel.example.com               127.0.0.1:8601;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com app.example.com passport.example.com account.example.com bangumi.example.com member.example.com panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    location = /auth { return 301 https://app.example.com/auth; }
    location ^~ /auth-api/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8601;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    location = /panel { return 404; }
    location ^~ /panel-api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8602;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com passport.example.com account.example.com bangumi.example.com member.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    location ~ ^/(panel|panel-api|auth|auth-api|status|status-api) { return 404; }
    location / {
        proxy_pass http://$bili_relay_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
