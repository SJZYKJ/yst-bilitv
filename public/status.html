<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iBiliTV 服务状态</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#101626;--line:#232c43;--text:#edf2ff;--muted:#8d9ab6;--green:#48e5a3;--blue:#6da8ff;--amber:#ffcc66;--red:#ff718a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#17213d 0,transparent 38%),var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
main{width:min(1040px,calc(100% - 32px));margin:auto;padding:54px 0 44px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:34px}.brand{display:flex;gap:15px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#6d8cff,#8b5cf6);box-shadow:0 12px 35px #5269e744;font-size:24px}.title h1{font-size:25px;margin:0 0 5px;letter-spacing:.2px}.title p{margin:0;color:var(--muted);font-size:14px}.badge{display:flex;align-items:center;gap:9px;border:1px solid #27664f;background:#113728;color:#85f6c3;border-radius:999px;padding:10px 15px;font-weight:700;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #48e5a31c;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.55}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:linear-gradient(160deg,#141b2e,#0e1321);border:1px solid var(--line);border-radius:19px;padding:22px;min-height:148px;box-shadow:0 18px 50px #0003}.label{color:var(--muted);font-size:13px;margin-bottom:18px}.value{font-size:32px;line-height:1;font-weight:800;letter-spacing:-1px}.unit{font-size:14px;font-weight:600;color:var(--muted);margin-left:5px}.sub{margin-top:15px;color:var(--muted);font-size:12px}.wide{grid-column:span 2}.latency{display:flex;align-items:flex-end;justify-content:space-between}.bars{height:49px;display:flex;gap:4px;align-items:flex-end}.bars i{display:block;width:5px;border-radius:5px;background:linear-gradient(#6da8ff,#6f6bff);opacity:.8}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:24px;color:var(--muted);font-size:12px}.error .badge{background:#3b1520;border-color:#6d2739;color:#ff9bad}.error .dot{background:var(--red)}
@media(max-width:760px){main{padding-top:30px}.top{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.card{min-height:135px}.value{font-size:28px}}
@media(max-width:480px){main{width:min(100% - 22px,1040px)}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.footer{flex-direction:column}.badge{padding:8px 12px}}
</style>
</head>
<body>
<main id="app">
  <div class="top">
    <div class="brand"><div class="logo">▸</div><div class="title"><h1>iBiliTV 服务状态</h1><p>解析中转服务实时运行概览</p></div></div>
    <div class="badge"><span class="dot"></span><span id="state">正在检测</span></div>
  </div>
  <section class="grid">
    <article class="card"><div class="label">累计请求</div><div class="value" id="total">--</div><div class="sub">服务记录的全部请求</div></article>
    <article class="card"><div class="label">今日请求</div><div class="value" id="today">--</div><div class="sub" id="success">成功率 --</div></article>
    <article class="card"><div class="label">已授权设备</div><div class="value" id="devices">--<span class="unit">台</span></div><div class="sub">当前可正常使用服务</div></article>
    <article class="card wide"><div class="label">服务器上游延迟</div><div class="latency"><div><span class="value" id="latency">--</span><span class="unit">ms</span><div class="sub" id="p95">P95 -- ms</div></div><div class="bars" aria-hidden="true"><i style="height:20%"></i><i style="height:38%"></i><i style="height:28%"></i><i style="height:56%"></i><i style="height:42%"></i><i style="height:75%"></i><i style="height:52%"></i><i style="height:88%"></i><i style="height:62%"></i><i style="height:100%"></i></div></div></article>
    <article class="card"><div class="label">连续运行</div><div class="value" id="uptime">--</div><div class="sub" id="sysup">服务器运行 --</div></article>
  </section>
  <div class="footer"><span>每 30 秒自动刷新</span><span id="updated">最后更新 --</span></div>
</main>
<script>
const $=id=>document.getElementById(id);const n=v=>Number(v||0).toLocaleString('zh-CN');
function duration(sec){sec=Math.max(0,Number(sec)||0);const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);return d?d+'天 '+h+'小时':h?h+'小时 '+m+'分钟':m+'分钟';}
async function load(){try{const r=await fetch('/status-api',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();$('state').textContent='所有系统正常';$('total').textContent=n(d.totalRequests);$('today').textContent=n(d.todayRequests);$('success').textContent='成功 '+n(d.todaySuccess)+' · 成功率 '+Number(d.successRate).toFixed(1)+'%';$('devices').innerHTML=n(d.authorizedDevices)+'<span class="unit">台</span>';$('latency').textContent=n(d.upstreamLatencyMs);$('p95').textContent='P95 '+n(d.upstreamP95Ms)+' ms';$('uptime').textContent=duration(d.processUptimeSec);$('sysup').textContent='服务器运行 '+duration(d.systemUptimeSec);$('updated').textContent='最后更新 '+new Date(d.updatedAt).toLocaleTimeString('zh-CN',{hour12:false});document.body.classList.remove('error');}catch(e){$('state').textContent='状态获取失败';document.body.classList.add('error');}}
load();setInterval(load,30000);
</script>
</body>
</html>
